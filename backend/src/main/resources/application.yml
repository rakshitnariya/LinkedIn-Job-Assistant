server:
  port: 8081

spring:
  application:
    name: job-assistant

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/job_assistant}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Google Gemini API Configuration (via OpenAI-compatible endpoint)
  ai:
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      api-key: ${GEMINI_API_KEY:AQ.Ab8RN6L0OKu-PvyyoENg5iqIln4EtkCRxJgn9LQzfzuA9iQU9Q}
      chat:
        options:
          model: gemini-1.5-flash
          temperature: 0.7

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Fast Offline/Local Mode
app:
  offline-mode: true

logging:
  level:
    org.springframework.web.client: DEBUG
    org.springframework.web: INFO
    org.springframework.ai: DEBUG
